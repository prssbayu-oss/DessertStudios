<!DOCTYPE html>
<html lang="en">
	<head>
		<title>dessert.js webgpu - postprocessing</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - postprocessing">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://github.com/prssbayu-oss/DessertStudios/examples/webgpu_postprocessing.html">
		<meta property="og:image" content="https://github.com/prssbayu-oss/DessertStudios/examples/screenshots/webgpu_postprocessing.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="https://github.com/prssbayu-oss/DessertStudios/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://github.com/prssbayu-oss/DessertStudios" target="_blank" rel="noopener">dessert.js</a><span>Post Processing</span>
			</div>

			<small>Mix of simple post processing effects.</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../src/dessert/Dessert.webgpu.js",
					"dessert": "../src/dessert/Dessert.webgpu.js",
					"three/webgpu": "../src/dessert/Dessert.webgpu.js",
					"three/tsl": "../src/dessert/Dessert.dsl.js",
					"three/addons/": "./jsm/",
					"dessert/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'dessert/webgpu';
			import { pass } from 'dessert/dsl';
			import { dotScreen } from 'dessert/addons/tsl/display/DotScreenNode.js';
			import { rgbShift } from 'dessert/addons/tsl/display/RGBShiftNode.js';
			import { Inspector } from 'dessert/addons/inspector/Inspector.js';

			let camera, renderer, renderPipeline;
			let object;

			init();

			function init() {

				renderer = new THREE.WebGPURenderer();
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );

				//

				camera = new THREE.PerspectiveCamera( 70, window.innerWidth / window.innerHeight, 1, 1000 );
				camera.position.z = 400;

				const scene = new THREE.Scene();
				scene.background = new THREE.Color( 0x000000 );
				scene.fog = new THREE.Fog( 0x000000, 1, 1000 );

				object = new THREE.Object3D();
				scene.add( object );

				const geometry = new THREE.SphereGeometry( 1, 4, 4 );
				const material = new THREE.MeshPhongMaterial( { color: 0xffffff, flatShading: true } );

				for ( let i = 0; i < 100; i ++ ) {

					const mesh = new THREE.Mesh( geometry, material );
					mesh.position.set( Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5 ).normalize();
					mesh.position.multiplyScalar( Math.random() * 400 );
					mesh.rotation.set( Math.random() * 2, Math.random() * 2, Math.random() * 2 );
					mesh.scale.x = mesh.scale.y = mesh.scale.z = Math.random() * 50;
					object.add( mesh );

				}

				scene.add( new THREE.AmbientLight( 0xcccccc ) );

				const light = new THREE.DirectionalLight( 0xffffff, 3 );
				light.position.set( 1, 1, 1 );
				scene.add( light );

				// postprocessing

				renderPipeline = new THREE.RenderPipeline( renderer );

				const scenePass = pass( scene, camera );
				const scenePassColor = scenePass.getTextureNode().toInspector( 'Scene Color' );

				const dotScreenPass = dotScreen( scenePassColor, 1.57, 0.3 );
				const rgbShiftPass = rgbShift( dotScreenPass, 0.001 );

				renderPipeline.outputNode = rgbShiftPass;

				//

				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				object.rotation.x += 0.005;
				object.rotation.y += 0.01;

				renderPipeline.render();

			}

		</script>

	</body>
</html>
