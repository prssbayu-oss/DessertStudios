<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DESSERT 3D Studio</title>
  <meta name="description" content="Full-control standalone 3D engine cloned and rebranded as DESSERT with zero external dependencies, complete math, core, renderers, materials, and scene editor.">
  <meta property="og:title" content="DESSERT 3D Studio">
  <meta property="og:description" content="Full-control standalone 3D engine cloned and rebranded as DESSERT with zero external dependencies, complete math, core, renderers, materials, and scene editor.">
  <link rel="shortcut icon" href="/files/favicon_white.ico" media="(prefers-color-scheme: dark)">
  <link rel="shortcut icon" href="/files/favicon.ico" media="(prefers-color-scheme: light)">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    :root {
      --bg-header: #111827;
      --border-header: #1f2937;
      --text-muted: #9ca3af;
      --text-light: #f3f4f6;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #030712;
      color: var(--text-light);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }
    header#suite-nav {
      height: 48px;
      background: #0b0f19;
      border-bottom: 1px solid #1f2937;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 100;
      user-select: none;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: inherit;
    }
    .brand-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(79, 70, 229, 0.4);
    }
    .brand-icon svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: white;
      stroke-width: 2;
    }
    .brand-name {
      font-weight: 700;
      font-size: 14px;
      letter-spacing: -0.01em;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge-rev {
      font-family: monospace;
      font-size: 10px;
      background: rgba(99, 102, 241, 0.2);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.4);
      padding: 1px 5px;
      border-radius: 4px;
    }
    .badge-offline {
      font-size: 11px;
      color: #34d399;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 3px 8px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .badge-offline::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #34d399;
      box-shadow: 0 0 6px #34d399;
    }
    nav.tabs {
      display: flex;
      align-items: center;
      background: #111827;
      padding: 3px;
      border-radius: 8px;
      border: 1px solid #1f2937;
      gap: 2px;
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: #9ca3af;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      text-decoration: none;
    }
    .tab-btn:hover {
      color: #f3f4f6;
      background: rgba(255, 255, 255, 0.05);
    }
    .tab-btn.active {
      background: #4f46e5;
      color: #ffffff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
    }
    .action-links {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .direct-link {
      font-size: 11px;
      color: #9ca3af;
      background: #1f2937;
      padding: 4px 8px;
      border-radius: 6px;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 4px;
      border: 1px solid #374151;
      transition: all 0.15s;
    }
    .direct-link:hover {
      color: #ffffff;
      background: #374151;
    }
    main#suite-viewport {
      flex: 1;
      position: relative;
      background: #000;
      width: 100%;
      height: calc(100vh - 48px);
    }
    iframe#app-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #000;
    }
    #loading-indicator {
      position: absolute;
      top: 12px;
      right: 16px;
      font-size: 11px;
      color: #9ca3af;
      background: rgba(17, 24, 39, 0.8);
      padding: 3px 8px;
      border-radius: 4px;
      pointer-events: none;
      display: none;
      z-index: 50;
    }
  </style>
</head>
<body>
  <!-- Top Universal DESSERT Suite Navigation Bar -->
  <header id="suite-nav">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24">
          <path d="M12 2L2 22h20L12 2z"/>
          <path d="M12 2v20"/>
          <path d="M2 22l10-10"/>
          <path d="M22 22L12 12"/>
        </svg>
      </div>
      <div class="brand-name">
        <span>DESSERT 3D</span>
        <span class="badge-rev">r186 dev</span>
      </div>
    </div>

    <!-- Suite Tabs -->
    <nav class="tabs" id="tab-container">
      <button class="tab-btn active" data-src="/editor/" id="btn-editor">
        🎨 3D Editor
      </button>
      <button class="tab-btn" data-src="/examples/" id="btn-examples">
        ⚡ Examples (400+)
      </button>
      <button class="tab-btn" data-src="/docs/" id="btn-docs">
        📖 Documentation
      </button>
      <button class="tab-btn" data-src="/manual/" id="btn-manual">
        📘 Manual
      </button>
      <button class="tab-btn" data-src="/src/" id="btn-source">
        💻 Source (/src)
      </button>
    </nav>

    <!-- Right Controls -->
    <div class="action-links">
      <div class="badge-offline">100% Offline (Direct Repo Clone)</div>
      <a id="open-standalone-btn" class="direct-link" href="/editor/" target="_blank" title="Buka tab ini secara fullscreen di tab baru">
        ↗ Buka Mandiri
      </a>
    </div>
  </header>

  <!-- Main Viewport containing 100% official DESSERT modules -->
  <main id="suite-viewport">
    <div id="loading-indicator">Memuat modul...</div>
    <iframe id="app-frame" src="/editor/" allow="fullscreen; xr-spatial-tracking; camera; microphone"></iframe>
  </main>

  <script>
    const frame = document.getElementById('app-frame');
    const loading = document.getElementById('loading-indicator');
    const standaloneBtn = document.getElementById('open-standalone-btn');
    const tabs = document.querySelectorAll('.tab-btn');

    // Parse URL hash if given, e.g. #examples or #docs or #editor
    const initialHash = window.location.hash.replace('#', '');
    if (initialHash) {
      const matchTab = document.querySelector(`[data-src*="${initialHash}"]`);
      if (matchTab) {
        switchTab(matchTab);
      }
    }

    tabs.forEach(tab => {
      tab.addEventListener('click', () => switchTab(tab));
    });

    function switchTab(targetTab) {
      tabs.forEach(t => t.classList.remove('active'));
      targetTab.classList.add('active');
      const src = targetTab.getAttribute('data-src');
      
      loading.style.display = 'block';
      frame.src = src;
      standaloneBtn.href = src;
      
      // Update hash
      const hash = src.replace(/\//g, '');
      if (hash) {
        history.replaceState(null, '', '#' + hash);
      }
    }

    frame.addEventListener('load', () => {
      loading.style.display = 'none';
    });
  </script>
</body>
</html>
